# Local development backend: PHP built-in server in Docker, reachable only
# from this machine on http://127.0.0.1:8000 (the Angular dev proxy target).
# Usage (from the repo root): docker compose -f dev/docker-compose.yml up
services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ..:/app
